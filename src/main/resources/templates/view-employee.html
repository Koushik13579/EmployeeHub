<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Employee Details</h2>

        <div class="mb-3">
            <strong>ID:</strong>
            <span th:text="${employee.id}"></span>
        </div>

        <div class="mb-3">
            <strong>First Name:</strong>
            <span th:text="${employee.firstName}"></span>
        </div>

        <div class="mb-3">
            <strong>Last Name:</strong>
            <span th:text="${employee.lastName}"></span>
        </div>

        <div class="mb-3">
            <strong>Email:</strong>
            <span th:text="${employee.email}"></span>
        </div>

        <div class="mb-3">
            <strong>Phone Number:</strong>
            <span th:text="${employee.phoneNumber}"></span>
        </div>

        <div class="mb-3">
            <strong>Department:</strong>
            <span th:text="${employee.department}"></span>
        </div>

        <div class="mb-3">
            <strong>Position:</strong>
            <span th:text="${employee.position}"></span>
        </div>

        <div class="mb-3">
            <strong>Joining Date:</strong>
            <span th:text="${employee.joiningDate}"></span>
        </div>

        <div class="mt-3">
            <a th:href="@{/employees}"
               class="btn btn-secondary">
                Back
            </a>
        </div>

    </div>

</div>

</body>
</html>
