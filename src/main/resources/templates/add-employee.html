<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Employee</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Add Employee
                    </h2>

                    <form th:action="@{/employees}"
                          th:object="${employee}"
                          method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                First Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{firstName}">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('firstName')}"
                                 th:errors="*{firstName}">
                                 </div>
                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Last Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{lastName}">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('lastName')}"
                                 th:errors="*{lastName}">
                            </div>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}">
                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}">
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>

                            <input type="text"
                                   th:field="*{phoneNumber}"
                                   class="form-control"
                                   placeholder="Enter 10-digit phone number">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('phoneNumber')}"
                                 th:errors="*{phoneNumber}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Department</label>

                            <select th:field="*{department}"
                                    class="form-select">

                                <option value="">Select Department</option>
                                <option value="IT">IT</option>
                                <option value="HR">HR</option>
                                <option value="Finance">Finance</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Operations">Operations</option>

                            </select>

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('department')}"
                                 th:errors="*{department}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Job Position</label>

                            <input type="text"
                                   th:field="*{position}"
                                   class="form-control"
                                   placeholder="Enter job position">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('position')}"
                                 th:errors="*{position}">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Joining Date</label>

                            <input type="date"
                                   th:field="*{joiningDate}"
                                   class="form-control">

                            <div class="text-danger"
                                 th:if="${#fields.hasErrors('joiningDate')}"
                                 th:errors="*{joiningDate}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="/employees"
                               class="btn btn-secondary">
                                Back
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Save Employee
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
</body>
</html>
