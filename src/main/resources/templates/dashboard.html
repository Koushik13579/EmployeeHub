<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>
        .fade-up {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .fade-up.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            EmployeeHub
        </a>

        <div class="navbar-nav">

            <a class="nav-link active"
               href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link"
               href="/employees">
                Employees
            </a>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Employee Dashboard</h1>

        <div>

            <a href="/employees"
               class="btn btn-secondary me-2">
                View Employees
            </a>

            <a href="/employees/new"
               class="btn btn-primary">
                Add Employee
            </a>

        </div>

    </div>


    <div class="row">

        <!-- Total Employees -->

        <div class="col-md-4">

            <div class="card text-center shadow h-100 fade-up">

                <div class="card-body d-flex flex-column justify-content-center">

                    <h5 class="card-title">
                        Total Employees
                    </h5>

                    <h1 class="display-4"
                        th:text="${totalEmployees}">
                        0
                    </h1>

                </div>

            </div>

        </div>


        <!-- Department Statistics -->

        <div class="col-md-8">

            <div class="card shadow h-100 fade-up">

                <div class="card-body">

                    <h3 class="mb-4">
                        Employees by Department
                    </h3>

                    <table class="table table-bordered mb-0">

                        <thead class="table-dark">

                        <tr>
                            <th>Department</th>
                            <th>Number of Employees</th>
                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="stat : ${departmentStats}">

                            <td th:text="${stat[0]}"></td>

                            <td th:text="${stat[1]}"></td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- Recent Employees -->

    <div class="row mt-4">

        <div class="col-md-12">

            <div class="card shadow fade-up">

                <div class="card-body">

                    <h3 class="mb-4">
                        Recent Employees
                    </h3>

                    <div class="table-responsive">

                        <table class="table table-bordered table-hover">

                            <thead class="table-dark">

                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>Position</th>
                                <th>Joining Date</th>
                                <th>Action</th>
                            </tr>

                            </thead>

                            <tbody>

                            <!-- Show when no employees exist -->
                            <tr th:if="${#lists.isEmpty(recentEmployees)}">

                                <td colspan="6"
                                    class="text-center text-muted">
                                    No employees found
                                </td>

                            </tr>


                            <!-- Show employees only when employees exist -->
                            <tr th:if="${not #lists.isEmpty(recentEmployees)}"
                                th:each="employee : ${recentEmployees}">

                                <td th:text="${employee.id}"></td>

                                <td>
                                    <span th:text="${employee.firstName}"></span>
                                    <span th:text="${employee.lastName}"></span>
                                </td>

                                <td th:text="${employee.department}"></td>

                                <td th:text="${employee.position}"></td>

                                <td th:text="${employee.joiningDate}"></td>

                                <td>
                                    <a th:href="@{/employees/view/{id}(id=${employee.id})}"
                                       class="btn btn-info btn-sm">
                                        View
                                    </a>
                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
<script>
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add("show");
            }
        });
    }, {
        threshold: 0.15
    });

    document.querySelectorAll(".fade-up").forEach(card => {
        observer.observe(card);
    });
</script>
</body>
</html>
