<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <style>
        html {
            visibility: hidden;
        }
        .employee-table {
            white-space: nowrap;
        }

        .employee-table th {
            padding: 14px 12px;
            font-size: 16px;
        }

        .employee-table td {
            padding: 14px 12px;
            vertical-align: middle;
        }

        .header-sort {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-width: 100px;
        }

        .sort-icons {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-shrink: 0;
        }

        .sort-icons a {
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
        }
        .header-sort {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .sort-icons {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sort-icons a {
            display: block;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            text-decoration: none;
        }

        /* Small upward arrow */
        .sort-up {
            border-bottom: 5px solid #adb5bd;
        }

        /* Small downward arrow */
        .sort-down {
            border-top: 5px solid #adb5bd;
        }

        .sort-icons a:hover {
            filter: brightness(1.8);
        }
    </style>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/dashboard">
            EmployeeHub
        </a>

        <div class="navbar-nav">

            <a class="nav-link"
               href="/dashboard">
                Dashboard
            </a>

            <a class="nav-link active"
               href="/employees">
                Employees
            </a>

        </div>

    </div>
</nav>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Employee Management System</h1>

        <div>

            <a href="/employees/export"
               class="btn btn-success me-2">
                Export CSV
            </a>

            <a href="/employees/new"
               class="btn btn-primary">
                Add Employee
            </a>

        </div>

    </div>

    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${successMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert">
        </button>

    </div>

    <script>
        setTimeout(function () {
            const alert = document.querySelector('.alert');

            if (alert) {
                alert.remove();
            }
        }, 3000);
    </script>

    <form th:action="@{/employees}"
          method="get"
          class="mb-4">

        <div class="d-flex gap-3 align-items-center">

            <!-- Search Input -->
            <input type="text"
                   name="keyword"
                   th:value="${keyword}"
                   class="form-control"
                   placeholder="Search by name or email">

            <!-- Department Filter -->
            <select name="department"
                    class="form-select"
                    style="max-width: 430px;">

                <option value="">All Departments</option>

                <option value="IT"
                        th:selected="${department == 'IT'}">
                    IT
                </option>

                <option value="HR"
                        th:selected="${department == 'HR'}">
                    HR
                </option>

                <option value="Finance"
                        th:selected="${department == 'Finance'}">
                    Finance
                </option>

                <option value="Marketing"
                        th:selected="${department == 'Marketing'}">
                    Marketing
                </option>

                <option value="Operations"
                        th:selected="${department == 'Operations'}">
                    Operations
                </option>

            </select>

            <!-- Push buttons to the far right -->
            <div class="ms-auto d-flex gap-3">

                <button type="submit"
                        class="btn btn-primary">
                    Search
                </button>

                <a href="/employees"
                   class="btn btn-secondary">
                    Clear
                </a>

            </div>

        </div>

    </form>


    <div class="table-responsive" id="employeeTableContainer">
        <table class="table table-bordered table-hover employee-table">

        <thead class="table-dark">
        <tr>

            <!-- ID -->
            <th>
                <div class="header-sort">
                    <span>ID</span>

                    <div class="sort-icons">

                        <a th:href="@{/employees(
    page=0,
    keyword=${keyword},
    department=${department},
    sortBy='id',
    direction='asc'
)}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(
    page=0,
    keyword=${keyword},
    department=${department},
    sortBy='id',
    direction='desc'
)}"
                           class="sort-down"></a>

                    </div>
                </div>
            </th>


            <!-- First Name -->
            <th>
                <div class="header-sort">
                    <span>First Name</span>

                    <div class="sort-icons">
                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='firstName', direction='asc')}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='firstName', direction='desc')}"
                           class="sort-down"></a>
                    </div>
                </div>
            </th>


            <!-- Last Name -->
            <th>
                <div class="header-sort">
                    <span>Last Name</span>

                    <div class="sort-icons">

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='lastName', direction='asc')}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='lastName', direction='desc')}"
                           class="sort-down"></a>

                    </div>
                </div>
            </th>


            <!-- Email -->
            <th>
                <div class="header-sort">
                    <span>Email</span>

                    <div class="sort-icons">

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='email', direction='asc')}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='email', direction='desc')}"
                           class="sort-down"></a>

                    </div>
                </div>
            </th>


            <!-- Phone Number -->
            <th>
                <div class="header-sort">
                    <span>Phone Number</span>

                    <div class="sort-icons">

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='phoneNumber', direction='asc')}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='phoneNumber', direction='desc')}"
                           class="sort-down"></a>

                    </div>
                </div>
            </th>

            <!-- Department -->
            <th>
                <div class="header-sort">
                    <span>Department</span>

                    <div class="sort-icons">

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='department', direction='asc')}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='department', direction='desc')}"
                           class="sort-down"></a>

                    </div>
                </div>
            </th>

            <th>
                <div class="header-sort">
                    <span>Position</span>

                    <div class="sort-icons">

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='position', direction='asc')}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='position', direction='desc')}"
                           class="sort-down"></a>

                    </div>
                </div>
            </th>

            <th>
                <div class="header-sort">
                    <span>Joining Date</span>

                    <div class="sort-icons">

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='joiningDate', direction='asc')}"
                           class="sort-up"></a>

                        <a th:href="@{/employees(page=0, keyword=${keyword},department=${department}, sortBy='joiningDate', direction='desc')}"
                           class="sort-down"></a>

                    </div>
                </div>
            </th>

            <!-- Actions -->
            <th>Actions</th>

        </tr>
        </thead>

            <tbody>

            <!-- Show when no employees are found -->
            <tr th:if="${#lists.isEmpty(employees)}">

                <td colspan="9"
                    class="text-center text-muted">
                    No employees found matching your search or filter.
                </td>

            </tr>


            <!-- Show employees when employees exist -->
            <tr th:if="${not #lists.isEmpty(employees)}"
                th:each="employee : ${employees}">

                <td th:text="${employee.id}"></td>

                <td th:text="${employee.firstName}"></td>

                <td th:text="${employee.lastName}"></td>

                <td th:text="${employee.email}"></td>

                <td th:text="${employee.phoneNumber}"></td>

                <td th:text="${employee.department}"></td>

                <td th:text="${employee.position}"></td>

                <td th:text="${employee.joiningDate}"></td>

                <td>
                    <div class="d-flex gap-2">

                        <a th:href="@{/employees/view/{id}(id=${employee.id})}"
                           class="btn btn-info btn-sm">
                            View
                        </a>

                        <a th:href="@{/employees/edit/{id}(id=${employee.id})}"
                           class="btn btn-warning btn-sm">
                            Edit
                        </a>

                        <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this employee?')">
                            Delete
                        </a>

                    </div>
                </td>

            </tr>

            </tbody>

    </table>
    </div>

    <nav th:if="${totalPages > 1}">

        <ul class="pagination justify-content-center">

            <!-- Previous Button -->
            <li class="page-item"
                th:classappend="${currentPage == 0} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/employees(
       page=${currentPage - 1},
       keyword=${keyword},
       department=${department},
       sortBy=${sortBy},
       direction=${direction}
   )}">
                    Previous
                </a>

            </li>


            <!-- Page Numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">

                <a class="page-link"
                   th:href="@{/employees(
       page=${i},
       keyword=${keyword},
       department=${department},
       sortBy=${sortBy},
       direction=${direction}
   )}"
                   th:text="${i + 1}">
                </a>

            </li>


            <!-- Next Button -->
            <li class="page-item"
                th:classappend="${currentPage == totalPages - 1} ? 'disabled'">

                <a class="page-link"
                   th:href="@{/employees(
       page=${currentPage + 1},
       keyword=${keyword},
       department=${department},
       sortBy=${sortBy},
       direction=${direction}
   )}">
                    Next
                </a>

            </li>

        </ul>

    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

<script>

    // Disable browser automatic scroll restoration
    if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
    }

    const tableContainer =
        document.getElementById("employeeTableContainer");


    // Restore saved scroll positions
    const savedHorizontal =
        sessionStorage.getItem("employeeTableScrollLeft");

    const savedVertical =
        sessionStorage.getItem("employeePageScrollTop");


    window.addEventListener("load", function () {

        if (savedHorizontal && tableContainer) {

            tableContainer.scrollLeft =
                parseInt(savedHorizontal);

        }

        if (savedVertical) {

            window.scrollTo(
                0,
                parseInt(savedVertical)
            );

        }

        // Remove saved values
        sessionStorage.removeItem("employeeTableScrollLeft");
        sessionStorage.removeItem("employeePageScrollTop");

        // Show page only after scroll restoration
        document.documentElement.style.visibility = "visible";

    });


    // Save position before clicking sort arrows
    document.querySelectorAll(
        ".sort-icons a, .pagination a"
    ).forEach(function (link) {

        link.addEventListener("click", function () {

            // Save horizontal table position
            if (tableContainer) {

                sessionStorage.setItem(
                    "employeeTableScrollLeft",
                    tableContainer.scrollLeft
                );

            }

            // Save vertical page position
            sessionStorage.setItem(
                "employeePageScrollTop",
                window.scrollY
            );

        });

    });
</script>


</body>
</html>
